[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI 依赖注入大量使用函数调用作为默认值
]

[tool.ruff.format]
quote-style = "double"

[project]
name = "agri_backend"  # 你的项目名
version = "0.1.0"      # 项目版本
requires-python = ">=3.12" # 建议把之前警告的 Python 版本要求也写上
dependencies = [
    "aiomysql==0.2.0",
    "alembic==1.14.0",
    "bcrypt==4.2.1",
    "cryptography==44.0.0",
    "fastapi==0.115.6",
    "passlib>=1.7.4",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pyjwt==2.10.1",
    "pymysql==1.1.1",
    "python-multipart==0.0.20",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.36",
    "tzdata==2024.2",
    "uvicorn[standard]==0.34.0",
]
